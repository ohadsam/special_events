name: Android CI
on:
  push:
    branches: [main, 'ccr-*', 'claude/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Check project exists
        id: has
        run: test -f gradlew && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: Lint, unit tests, debug APK
        if: steps.has.outputs.ok == 'true'
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug assembleRelease --stacktrace
      - name: Print Room schemas (commit them under app/schemas when they change)
        if: steps.has.outputs.ok == 'true'
        run: |
          echo "ROOM_SCHEMA_BEGIN"
          find app/schemas -name '*.json' 2>/dev/null | sort | while read -r f; do echo "== $f"; cat "$f"; done
          echo "ROOM_SCHEMA_END"
      - name: Name the APK (version + commit) so the right build is always identifiable
        if: steps.has.outputs.ok == 'true'
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/App-v${VER}-${SHA}-debug.apk"
          echo "Built App v${VER} @ ${SHA}"
      - name: Signing certificate of the debug APK (must stay identical across builds)
        if: steps.has.outputs.ok == 'true'
        run: keytool -printcert -jarfile dist/*-debug.apk | grep -E 'SHA256|Owner' || true
      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.ok == 'true'
        with:
          name: debug-apk
          path: dist/*.apk
