name: Publish latest APK
# On every merge to main: build the signed release APK and (re)publish it as the pre-release "latest",
# so a correctly named, current APK is always available to download and share.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Guard - this build must install as a plain update over the published one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          NEW=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p prev && cd prev
          if ! gh release download latest --pattern '*.apk' --repo "$GITHUB_REPOSITORY" 2>/dev/null; then echo "No previous release: nothing to compare."; exit 0; fi
          OLD=$(ls *.apk | head -1); cd ..
          cert() { "$BT/apksigner" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest'; }
          code() { "$BT/aapt2" dump badging "$1" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1; }
          pkg() { "$BT/aapt2" dump badging "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p"; }
          echo "old: $(pkg prev/$OLD) code=$(code prev/$OLD) $(cert prev/$OLD)"
          echo "new: $(pkg $NEW) code=$(code $NEW) $(cert $NEW)"
          [ "$(pkg prev/$OLD)" = "$(pkg $NEW)" ] || { echo "::error::applicationId changed - users would have to reinstall"; exit 1; }
          [ "$(cert prev/$OLD)" = "$(cert $NEW)" ] || { echo "::error::signing certificate changed - users would have to reinstall"; exit 1; }
          [ "$(code $NEW)" -gt "$(code prev/$OLD)" ] || { echo "::error::versionCode did not increase - Android refuses the update"; exit 1; }
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APK="SpecialEvents-v${VER}-${SHA}.apk"
          cp "$SRC" "$APK"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build v${VER} (${SHA})" \
            --notes "Automatic build of main @ ${SHA}. Sideload-signed: installs over any previous build of this app."
