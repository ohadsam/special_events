name: Android CI
on:
  push:
    branches: [main, 'ccr-*', 'claude/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Check project exists
        id: has
        run: test -f gradlew && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: Lint, unit tests, debug APK
        if: steps.has.outputs.ok == 'true'
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Failure summary (compile errors, failed tests; keeps CI logs cheap to read)
        if: failure()
        run: |
          echo "=== FAILURE SUMMARY BEGIN ==="
          grep -E "^e: |Test .*FAILED|AssertionError|FAILURE: Build failed" build.log | cut -c1-300 | head -40 || true
          awk '/What went wrong/{f=1} f{print; n++} n>10{exit}' build.log | cut -c1-300 || true
          # Also as annotations: readable cheaply with  gh api repos/OWNER/REPO/check-runs/JOB_ID/annotations -q '.[].message'
          grep -E "^e: |Test .*FAILED|AssertionError|What went wrong|Execution failed" build.log | cut -c1-250 | head -12 | while read -r l; do echo "::error::${l}"; done || true
          # Lint prints only a count to the console; the findings live in the text report.
          for f in app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E "Error:" "$f" | cut -c1-250 | head -15 | while read -r l; do echo "::error::${l}"; echo "$l"; done
          done || true
          echo "=== FAILURE SUMMARY END ==="
      - name: Commit regenerated Room schemas (only when they changed; [skip ci] prevents a loop)
        if: steps.has.outputs.ok == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Room schema [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Name the APK (version + commit) so the right build is always identifiable
        if: steps.has.outputs.ok == 'true'
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/SpecialEvents-v${VER}-${SHA}-debug.apk"
          echo "Built SpecialEvents v${VER} @ ${SHA}"
      - name: Signing certificate of the debug APK (must stay identical across builds)
        if: steps.has.outputs.ok == 'true'
        run: keytool -printcert -jarfile dist/*-debug.apk | grep -E 'SHA256|Owner' || true
      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.ok == 'true'
        with:
          name: debug-apk
          path: dist/*.apk
