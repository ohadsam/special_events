name: Android CI
on:
  push:
    branches: [main, 'ccr-*', 'claude/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Check project exists
        id: has
        run: test -f gradlew && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "ok=false" >> "$GITHUB_OUTPUT"
      - name: Lint, unit tests, debug APK
        if: steps.has.outputs.ok == 'true'
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug assembleRelease --stacktrace
      - name: Signing certificate of the debug APK (must stay identical across builds)
        if: steps.has.outputs.ok == 'true'
        run: keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA256|Owner' || true
      - uses: actions/upload-artifact@v4
        if: steps.has.outputs.ok == 'true'
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
