# Overrides on top of detekt's defaults (buildUponDefaultConfig = true).
style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
complexity:
  LongMethod:
    threshold: 80
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
